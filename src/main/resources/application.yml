
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mmagym?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:mmagym_user}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Kolkata
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

meta:
  access-token: ${META_ACCESS_TOKEN}
  phone-number-id: ${META_PHONE_NUMBER_ID}
  verify-token: ${META_VERIFY_TOKEN}
  api-url: https://graph.facebook.com/v21.0

app:
  admin-phone: ${ADMIN_PHONE}
  timezone: Asia/Kolkata
  checkin:
    window-minutes: 30
