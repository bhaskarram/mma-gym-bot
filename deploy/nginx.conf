# /etc/nginx/sites-available/mmabot
# Symlink: ln -s /etc/nginx/sites-available/mmabot /etc/nginx/sites-enabled/mmabot
#
# Before using:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. bot.mmagym.in)
#   2. Run: sudo certbot --nginx -d YOUR_DOMAIN
#      Certbot will auto-fill the ssl_certificate lines and redirect HTTP -> HTTPS
#
# Rate limiting — protects webhook from spam/abuse
# Zone: 10MB shared memory = ~160,000 unique IPs tracked
# Limit: 10 requests/second per IP (Meta sends at most 1-2/s normally)
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

# ── HTTP — redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt ACME challenge (certbot needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # All other traffic -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main server block ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL certificates — filled in by certbot automatically after running:
    # sudo certbot --nginx -d YOUR_DOMAIN
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Webhook endpoint — public, rate-limited ───────────────────────────────
    location /webhook {
        # burst=20: allows short spikes (20 queued) before returning 429
        # nodelay: reject burst overflow immediately, don't delay
        limit_req zone=webhook burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Meta expects 200 within 15s — generous timeout
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # ── Health endpoint — public (for UptimeRobot monitoring) ────────────────
    location /manage/health {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── Actuator (metrics, info) — BLOCKED from public internet ──────────────
    # Access only via SSH tunnel:
    #   ssh -L 9090:localhost:8080 ubuntu@YOUR_SERVER_IP
    #   curl http://localhost:9090/manage/metrics
    location /manage/ {
        deny all;
        return 403;
    }

    # ── Block everything else ─────────────────────────────────────────────────
    location / {
        return 404;
    }
}
